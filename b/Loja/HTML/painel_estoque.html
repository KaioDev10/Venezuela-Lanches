<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/b/Loja/CSS/painel_estoque.css">
    <link rel="shortcut icon" href="/b/Loja/logo/logo.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <title>Produtos</title>
</head>

<body>
    <div class="container">

        <div>
            <img src="/b/Loja/logo/logo.png" alt="Logo">
            <h1>Estoque de Produtos</h1>
        </div>

        <div class="comidas">

            <div class="pasteis">
                <h2>Pasteis</h2>
                <select>
                    <option> </option>
                    <option>Pastel De Carne</option>
                    <option>Pastel De Frango</option>
                    <option>Pastel De Queijo</option>
                    <option>Pastel De Carne e Queijo</option>
                    <option>Pastel De Carne e Cheddar</option>
                    <option>Pastel De Carne e Catupiry</option>
                    <option>Pastel De Ovo</option>
                    <option>Pastel De Frango e Queijo</option>
                    <option>Pastel De Frango e Catupiry</option>
                    <option>Pastel De Frango e Cheddar</option>
                    <option>Pastel De Frango Ovo</option>
                </select>
            </div>

            <div class="Hotdogs">
                <h2>Hotdogs</h2>
                <select>
                    <option> </option>
                    <option>Hot Dog</option>
                    <option>Hot Dog Duplo</option>
                    <option>Hot Dog Bacon</option>
                    <option>Hot Dog Calabresa</option>
                    <option>Hot Dog Especial</option>
                </select>
            </div>

            <div class="Empanados">
                <h2>Empanados</h2>
                <select>
                    <option> </option>
                    <option>Empanada De Frango</option>
                    <option>Empanada De Carne</option>
                </select>
            </div>

            <div class="Espetinhos">
                <h2>Espetinhos</h2>
                <select>
                    <option> </option>
                    <option>Espetinho De Carne</option>
                    <option>Espetinho De Frango</option>
                    <option>Espetinho Misto</option>
                </select>
            </div>

            <div class="Diversos">
                <h2>Diversos</h2>
                <select>
                    <option> </option>
                    <option>Batata Frita 250G</option>
                    <option>Salchi Batata Meia</option>
                    <option>Arroz Frito Chinês Meia</option>
                </select>
            </div>

            <div class="Bebidas">
                <h2>Bebidas</h2>
                <select>
                    <option> </option>
                    <option>Coca-Cola Lata</option>
                    <option>Guaraná Antártica Lata</option>
                    <option>Fanta Uva Lata</option>
                    <option>Fanta Laranja Lata</option>
                    <option>Água</option>
                </select>
            </div>
        </div>

        <div class="botoes">
            <button>Ocultar</button>
            <button>Mostrar</button>
        </div>
    </div>
    <script type="module" src="/b/Loja/JS/pedidos.js"></script>
</body>

</html>
